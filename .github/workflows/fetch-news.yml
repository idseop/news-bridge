name: fetch-news

# 매일 07:00 KST(22:00 UTC)에 뉴스 RSS를 수집해서 feeds/ 폴더에 날짜별 JSON으로 커밋한다.
# Cowork 예약 작업(08:00 KST)이 raw.githubusercontent.com으로 이 파일을 읽어간다.
on:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC = 07:00 KST. GitHub cron은 최대 15~20분 지연될 수 있어 08시 실행 1시간 전으로 잡음
  workflow_dispatch: {}      # 수동 실행 버튼(테스트용)

permissions:
  contents: write            # feeds/ 폴더에 커밋하기 위해 필요

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch all RSS feeds
        run: python3 .github/scripts/fetch_feeds.py

      - name: Commit snapshot
        run: |
          git config user.name  "news-bridge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feeds/
          # 변경 없으면(주말 등) 실패하지 않게 처리
          git diff --cached --quiet || git commit -m "feeds: $(date -u +%Y-%m-%d)"
          git push
